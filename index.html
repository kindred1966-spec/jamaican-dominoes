<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jamaican Domino Table</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js" defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      width: 100%;
      background: #000;
      padding: 15px;
      text-align: center;
      border-bottom: 3px solid #009b3a;
    }
    h1 { color: #fed100; font-size: 1.5rem; margin-bottom: 8px; }
    #lobby { margin: 20px; text-align: center; background: #1e1e1e; padding: 20px; border-radius: 8px; border: 1px solid #333; max-width: 450px; width: 90%; }
    input, select, button {
      padding: 10px 15px;
      font-size: 1rem;
      border-radius: 5px;
      border: none;
      margin: 5px;
    }
    select { background: #222; color: #fff; border: 1px solid #555; width: 100%; }
    button {
      background: #009b3a;
      color: white;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
    button:hover { background: #007a2e; }
    .setting-group { margin: 12px 0; text-align: left; }
    label { display: block; font-size: 0.9rem; color: #aaa; margin-bottom: 4px; }
    #game-container {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 1000px;
      margin-top: 10px;
    }
    #table {
      width: 95%;
      height: 440px;
      background: #1b5e20;
      border: 14px solid #3e2723;
      border-radius: 12px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.7);
    }
    #board-line {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 30px;
      min-width: max-content;
    }

    .drop-zone {
      width: 50px;
      height: 90px;
      border: 2px dashed #fed100;
      border-radius: 6px;
      background: rgba(254, 209, 0, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fed100;
      font-size: 0.75rem;
      text-transform: uppercase;
      transition: all 0.2s ease;
      user-select: none;
    }
    .drop-zone.drag-over {
      background: rgba(254, 209, 0, 0.4);
      transform: scale(1.08);
      border-style: solid;
    }

    .domino {
      width: 46px;
      height: 88px;
      background: #fffdfa;
      border-radius: 6px;
      border: 2px solid #333;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 4px 8px rgba(0,0,0,0.5);
      user-select: none;
      transition: transform 0.15s ease;
    }
    .domino.horizontal {
      width: 88px;
      height: 46px;
      flex-direction: row;
    }
    .domino-half {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 3px;
      gap: 2px;
      align-items: center;
      justify-items: center;
    }
    .divider {
      height: 2px;
      background: #222;
      width: 100%;
    }
    .horizontal .divider {
      width: 2px;
      height: 100%;
    }
    .pip {
      width: 7px;
      height: 7px;
      background-color: #111;
      border-radius: 50%;
    }
    
    #hand-container {
      margin-top: 15px;
      text-align: center;
      width: 100%;
      max-width: 900px;
    }
    #hand {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .domino.draggable {
      cursor: grab;
    }
    .domino.draggable:active {
      cursor: grabbing;
      opacity: 0.6;
    }
    .domino.unplayable {
      opacity: 0.4;
      filter: grayscale(60%);
    }
    #status {
      margin: 10px;
      font-size: 1.1rem;
      color: #fed100;
    }

    #choice-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-content {
      background: #222;
      padding: 25px;
      border-radius: 8px;
      border: 2px solid #fed100;
      text-align: center;
    }
    .modal-content button {
      margin: 10px;
      width: 120px;
    }
  </style>
</head>
<body>

  <header>
    <h1>JAMAICAN DOMINO TABLE 🁌</h1>
    <div id="status">Initializing network...</div>
  </header>

  <!-- LOBBY -->
  <div id="lobby">
    <div id="host-controls">
      <h3>Create New Table</h3>
      <div class="setting-group">
        <label>Number of Players:</label>
        <select id="max-players" onchange="updateHandOptions()">
          <option value="4">4 Players</option>
          <option value="3">3 Players</option>
          <option value="2">2 Players</option>
        </select>
      </div>
      <div class="setting-group">
        <label>Hand Size per Player:</label>
        <select id="hand-size">
          <option value="7">7 Tiles</option>
        </select>
      </div>
      <button id="create-btn" onclick="createRoom()" style="margin-top: 10px;" disabled>Create Table</button>
    </div>
    
    <div style="margin-top: 25px; border-top: 1px solid #444; padding-top: 15px;">
      <h3>Join Existing Table</h3>
      <input type="text" id="room-input" placeholder="Enter Room Code/ID" style="width:100%;" />
      <button id="join-btn" onclick="joinRoom()" style="background:#2196F3;" disabled>Join Table / Spectate</button>
    </div>
  </div>

  <!-- CHOICE MODAL -->
  <div id="choice-modal">
    <div class="modal-content">
      <h3>Tile fits both ends!</h3>
      <p style="margin: 10px 0; color: #ccc;">Choose which end of the board to play on:</p>
      <button onclick="resolveChoice('left')" style="background:#009b3a;">Left End</button>
      <button onclick="resolveChoice('right')" style="background:#d32f2f;">Right End</button>
    </div>
  </div>

  <!-- GAMEPLAY -->
  <div id="game-container">
    <div id="table">
      <div id="board-line"></div>
    </div>

    <div id="hand-container">
      <h3 id="hand-title">Your Hand</h3>
      <div id="hand"></div>
      <button id="pass-btn" onclick="passTurn()" style="display:none; margin-top:12px; background:#d32f2f; width:auto; padding: 10px 25px;">PASS TURN</button>
      <button id="join-table-btn" onclick="requestJoinSeat()" style="display:none; margin-top:12px; background:#009b3a; width:auto; padding: 10px 25px;">JOIN OPEN SEAT</button>
    </div>
  </div>

  <script>
    let peer = null;
    let connections = []; // Host tracker for players
    let spectatorConns = []; // Host tracker for spectators
    let hostConn = null;
    let isHost = false;
    let isSpectator = false;
    let myPlayerId = null;

    let gameState = {
      players: [],
      spectators: [],
      maxPlayers: 4,
      handSize: 7,
      turnIndex: 0,
      board: [],   
      hands: {},   
      gameStarted: false
    };

    let myHand = [];
    let draggedTile = null;
    let pendingTile = null;

    window.addEventListener('DOMContentLoaded', () => {
      initPeer();
    });

    function initPeer() {
      if (typeof Peer === 'undefined') {
        setTimeout(initPeer, 1000);
        return;
      }

      peer = new Peer();

      peer.on('open', (id) => {
        myPlayerId = id;
        document.getElementById('status').innerText = `Connected! Ready to play.`;
        document.getElementById('create-btn').disabled = false;
        document.getElementById('join-btn').disabled = false;
        
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        if (roomId) {
          document.getElementById('room-input').value = roomId;
          joinRoom();
        }
      });

      peer.on('error', (err) => {
        document.getElementById('status').innerText = `Connection issue (${err.type}). Refresh page.`;
      });

      peer.on('connection', (conn) => {
        if (!isHost) return;
        
        conn.on('open', () => {
          // Check if table is full
          if (gameState.players.length < gameState.maxPlayers && !gameState.gameStarted) {
            gameState.players.push(conn.peer);
            connections.push(conn);
            broadcastStatus(`Player joined (${gameState.players.length}/${gameState.maxPlayers})`);
            
            if (gameState.players.length === gameState.maxPlayers) {
              startGame();
            } else {
              syncState();
            }
          } else {
            // Table full or game started -> Route to Spectators
            spectatorConns.push(conn);
            gameState.spectators.push(conn.peer);
            conn.send({ type: 'NOTIFY_SPECTATOR' });
            syncState();
          }
        });

        conn.on('data', (data) => handleAction(data, conn.peer));
        
        conn.on('close', () => {
          handleDisconnection(conn.peer);
        });
      });
    }

    function handleDisconnection(peerId) {
      if (!isHost) return;
      // Remove from players if present
      gameState.players = gameState.players.filter(p => p !== peerId);
      connections = connections.filter(c => c.peer !== peerId);
      
      // Remove from spectators if present
      gameState.spectators = gameState.spectators.filter(s => s !== peerId);
      spectatorConns = spectatorConns.filter(c => c.peer !== peerId);

      broadcastStatus(`A user disconnected. Open seats available.`);
      syncState();
    }

    function updateHandOptions() {
      const maxP = parseInt(document.getElementById('max-players').value);
      const handSelect = document.getElementById('hand-size');
      handSelect.innerHTML = '';

      if (maxP === 4) {
        handSelect.innerHTML = `<option value="7">7 Tiles</option>`;
      } else if (maxP === 3) {
        handSelect.innerHTML = `
          <option value="7">7 Tiles</option>
          <option value="9">9 Tiles</option>
        `;
      } else if (maxP === 2) {
        handSelect.innerHTML = `
          <option value="7">7 Tiles</option>
          <option value="14">14 Tiles</option>
        `;
      }
    }

    function createRoom() {
      if (!myPlayerId) return;
      isHost = true;
      gameState.maxPlayers = parseInt(document.getElementById('max-players').value);
      gameState.handSize = parseInt(document.getElementById('hand-size').value);
      gameState.players = [myPlayerId];

      const roomLink = `${window.location.origin}${window.location.pathname}?room=${myPlayerId}`;
      
      document.getElementById('lobby').innerHTML = `
        <h3>Table Created!</h3>
        <p style="margin: 10px 0;">Share this link with friends (${gameState.maxPlayers}-player table):</p>
        <input type="text" value="${roomLink}" readonly style="width: 100%; text-align:center;" id="share-link"/>
        <button onclick="navigator.clipboard.writeText('${roomLink}')" style="margin-top:10px;">Copy Link</button>
        <p style="margin-top:15px; color:#fed100;">Waiting for players (1/${gameState.maxPlayers})...</p>
      `;
      document.getElementById('game-container').style.display = 'flex';
    }

    function joinRoom() {
      const hostId = document.getElementById('room-input').value.trim();
      if (!hostId || !peer) return;

      hostConn = peer.connect(hostId);
      
      hostConn.on('open', () => {
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('game-container').style.display = 'flex';
        document.getElementById('status').innerText = "Connected to table!";
      });

      hostConn.on('data', (data) => {
        if (data.type === 'NOTIFY_SPECTATOR') {
          isSpectator = true;
          document.getElementById('hand-title').innerText = "Spectator View (Table Full)";
          document.getElementById('join-table-btn').style.display = 'inline-block';
        }
        updateClient(data);
      });
    }

    function requestJoinSeat() {
      if (!isSpectator || !hostConn) return;
      hostConn.send({ type: 'REQUEST_JOIN_SEAT', peerId: myPlayerId });
    }

    // --- GAME ENGINE ---

    function generateDeck() {
      let deck = [];
      for (let i = 0; i <= 6; i++) {
        for (let j = i; j <= 6; j++) {
          deck.push({ left: i, right: j });
        }
      }
      return deck.sort(() => Math.random() - 0.5);
    }

    function startGame() {
      const deck = generateDeck();
      gameState.board = [];
      gameState.gameStarted = true;
      
      const hSize = gameState.handSize;
      gameState.players.forEach((pId, idx) => {
        gameState.hands[pId] = deck.slice(idx * hSize, (idx + 1) * hSize);
      });

      gameState.turnIndex = 0;
      gameState.players.forEach((pId, idx) => {
        if (gameState.hands[pId].some(t => t.left === 6 && t.right === 6)) {
          gameState.turnIndex = idx;
        }
      });

      syncState();
    }

    function handleAction(action, playerId) {
      if (!isHost) return;

      if (action.type === 'REQUEST_JOIN_SEAT') {
        if (gameState.players.length < gameState.maxPlayers && gameState.spectators.includes(action.peerId)) {
          // Promote spectator to player
          gameState.spectators = gameState.spectators.filter(s => s !== action.peerId);
          gameState.players.push(action.peerId);
          
          // Re-route connection tracking
          let conn = spectatorConns.find(c => c.peer === action.peerId);
          spectatorConns = spectatorConns.filter(c => c.peer !== action.peerId);
          if (conn) connections.push(conn);

          // Deal a hand if game has started
          if (gameState.gameStarted) {
            let deck = generateDeck();
            gameState.hands[action.peerId] = deck.slice(0, gameState.handSize);
          }
          syncState();
        }
        return;
      }

      const currentTurnPlayer = gameState.players[gameState.turnIndex];
      if (playerId !== currentTurnPlayer) return;

      if (action.type === 'PLAY_TILE') {
        const { tile, side } = action;
        
        gameState.hands[playerId] = gameState.hands[playerId].filter(
          t => !(t.left === tile.left && t.right === tile.right)
        );

        if (gameState.board.length === 0) {
          gameState.board.push(tile);
        } else if (side === 'left') {
          if (tile.right !== gameState.board[0].left) {
            let temp = tile.left; tile.left = tile.right; tile.right = temp;
          }
          gameState.board.unshift(tile);
        } else if (side === 'right') {
          if (tile.left !== gameState.board[gameState.board.length - 1].right) {
            let temp = tile.left; tile.left = tile.right; tile.right = temp;
          }
          gameState.board.push(tile);
        }

        if (gameState.hands[playerId].length === 0) {
          broadcastStatus(`GAME OVER! Player ${playerId.substring(0,4)} Dominoed!`);
          syncState();
          return;
        }

        gameState.turnIndex = (gameState.turnIndex + 1) % gameState.players.length;
        syncState();
      } else if (action.type === 'PASS') {
        gameState.turnIndex = (gameState.turnIndex + 1) % gameState.players.length;
        syncState();
      }
    }

    function syncState() {
      // Sync to all active players
      connections.forEach(conn => {
        conn.send({
          type: 'SYNC',
          state: {
            ...gameState,
            myHand: gameState.hands[conn.peer]
          }
        });
      });

      // Sync to spectators (empty hand)
      spectatorConns.forEach(conn => {
        conn.send({
          type: 'SYNC',
          state: {
            ...gameState,
            myHand: []
          }
        });
      });

      // Update host screen
      updateClient({
        type: 'SYNC',
        state: {
          ...gameState,
          myHand: gameState.hands[myPlayerId] || []
        }
      });
    }

    // --- PIP RENDERING ---

    const pipMap = {
      0: [],
      1: [4],
      2: [0, 8],
      3: [0, 4, 8],
      4: [0, 2, 6, 8],
      5: [0, 2, 4, 6, 8],
      6: [0, 2, 3, 5, 6, 8]
    };

    function createHalfElement(count) {
      const halfDiv = document.createElement('div');
      halfDiv.className = 'domino-half';
      
      const positions = pipMap[count] || [];
      for (let i = 0; i < 9; i++) {
        const cell = document.createElement('div');
        if (positions.includes(i)) {
          cell.className = 'pip';
        }
        halfDiv.appendChild(cell);
      }
      return halfDiv;
    }

    function renderDominoNode(tile, isBoardTile) {
      const isDouble = tile.left === tile.right;
      const div = document.createElement('div');
      
      div.className = `domino ${isBoardTile && !isDouble ? 'horizontal' : ''}`;
      
      const half1 = createHalfElement(tile.left);
      const divider = document.createElement('div');
      divider.className = 'divider';
      const half2 = createHalfElement(tile.right);

      div.appendChild(half1);
      div.appendChild(divider);
      div.appendChild(half2);

      return div;
    }

    // --- CLIENT UI ---

    function updateClient(payload) {
      if (payload.type === 'SYNC') {
        const state = payload.state;
        myHand = state.myHand || [];
        
        const activePlayer = state.players[state.turnIndex];
        const isMyTurn = (!isSpectator && activePlayer === myPlayerId);

        if (isSpectator) {
          document.getElementById('status').innerText = `Spectating Live Table (${state.players.length}/${state.maxPlayers} players seated)`;
          if (state.players.length < state.maxPlayers) {
            document.getElementById('join-table-btn').style.display = 'inline-block';
          } else {
            document.getElementById('join-table-btn').style.display = 'none';
          }
        } else {
          document.getElementById('status').innerText = isMyTurn 
            ? "YOUR TURN! Drag a matching tile onto the table." 
            : `Player ${state.turnIndex + 1}'s Turn...`;
        }

        renderBoard(state.board);
        renderHand(myHand, state.board, isMyTurn);
      }
    }

    function renderBoard(board) {
      const boardElem = document.getElementById('board-line');
      boardElem.innerHTML = '';

      if (board.length === 0) {
        const centerZone = document.createElement('div');
        centerZone.className = 'drop-zone';
        centerZone.innerText = 'Pose [6-6]';
        if (!isSpectator) setupDropZoneEvents(centerZone, 'center');
        boardElem.appendChild(centerZone);
        return;
      }

      const leftZone = document.createElement('div');
      leftZone.className = 'drop-zone';
      leftZone.innerText = 'Left';
      if (!isSpectator) setupDropZoneEvents(leftZone, 'left');
      boardElem.appendChild(leftZone);

      board.forEach(tile => {
        const dominoNode = renderDominoNode(tile, true);
        boardElem.appendChild(dominoNode);
      });

      const rightZone = document.createElement('div');
      rightZone.className = 'drop-zone';
      rightZone.innerText = 'Right';
      if (!isSpectator) setupDropZoneEvents(rightZone, 'right');
      boardElem.appendChild(rightZone);
    }

    function renderHand(hand, board, isMyTurn) {
      const handElem = document.getElementById('hand');
      const passBtn = document.getElementById('pass-btn');
      handElem.innerHTML = '';
      
      let hasPlayable = false;

      hand.forEach(tile => {
        const div = renderDominoNode(tile, false);
        const validSides = getValidPlaySides(tile, board);

        if (isMyTurn) {
          if (validSides.length > 0) {
            hasPlayable = true
