<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jamaican Domino Table</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      width: 100%;
      background: #000;
      padding: 15px;
      text-align: center;
      border-bottom: 3px solid #009b3a;
    }
    h1 { color: #fed100; font-size: 1.5rem; margin-bottom: 8px; }
    #lobby { margin: 20px; text-align: center; background: #1e1e1e; padding: 20px; border-radius: 8px; border: 1px solid #333; max-width: 450px; width: 90%; }
    input, select, button {
      padding: 10px 15px;
      font-size: 1rem;
      border-radius: 5px;
      border: none;
      margin: 5px;
    }
    select { background: #222; color: #fff; border: 1px solid #555; width: 100%; }
    button {
      background: #009b3a;
      color: white;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
    button:hover { background: #007a2e; }
    .setting-group { margin: 12px 0; text-align: left; }
    label { display: block; font-size: 0.9rem; color: #aaa; margin-bottom: 4px; }
    #game-container {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 1000px;
      margin-top: 10px;
    }
    #table {
      width: 95%;
      height: 440px;
      background: #1b5e20;
      border: 14px solid #3e2723;
      border-radius: 12px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.7);
    }
    #board-line {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 30px;
      min-width: max-content;
    }

    /* DROP TARGET ZONES */
    .drop-zone {
      width: 50px;
      height: 90px;
      border: 2px dashed #fed100;
      border-radius: 6px;
      background: rgba(254, 209, 0, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fed100;
      font-size: 0.75rem;
      text-transform: uppercase;
      transition: all 0.2s ease;
      user-select: none;
    }
    .drop-zone.drag-over {
      background: rgba(254, 209, 0, 0.4);
      transform: scale(1.08);
      border-style: solid;
    }

    /* DOMINO TILE STYLES */
    .domino {
      width: 46px;
      height: 88px;
      background: #fffdfa;
      border-radius: 6px;
      border: 2px solid #333;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 4px 8px rgba(0,0,0,0.5);
      user-select: none;
      transition: transform 0.15s ease;
    }
    .domino.horizontal {
      width: 88px;
      height: 46px;
      flex-direction: row;
    }
    .domino-half {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 3px;
      gap: 2px;
      align-items: center;
      justify-items: center;
    }
    .divider {
      height: 2px;
      background: #222;
      width: 100%;
    }
    .horizontal .divider {
      width: 2px;
      height: 100%;
    }
    .pip {
      width: 7px;
      height: 7px;
      background-color: #111;
      border-radius: 50%;
    }
    
    #hand-container {
      margin-top: 15px;
      text-align: center;
      width: 100%;
      max-width: 900px;
    }
    #hand {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .domino.draggable {
      cursor: grab;
    }
    .domino.draggable:active {
      cursor: grabbing;
      opacity: 0.6;
    }
    .domino.unplayable {
      opacity: 0.4;
      filter: grayscale(60%);
    }
    #status {
      margin: 10px;
      font-size: 1.1rem;
      color: #fed100;
    }

    /* CHOICE MODAL FOR DUAL-END MATCHES */
    #choice-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-content {
      background: #222;
      padding: 25px;
      border-radius: 8px;
      border: 2px solid #fed100;
      text-align: center;
    }
    .modal-content button {
      margin: 10px;
      width: 120px;
    }
  </style>
</head>
<body>

  <header>
    <h1>JAMAICAN DOMINO TABLE 🁌</h1>
    <div id="status">Connecting to network...</div>
  </header>

  <!-- LOBBY -->
  <div id="lobby">
    <div id="host-controls">
      <h3>Create New Table</h3>
      <div class="setting-group">
        <label>Number of Players:</label>
        <select id="max-players" onchange="updateHandOptions()">
          <option value="4">4 Players</option>
          <option value="3">3 Players</option>
          <option value="2">2 Players</option>
        </select>
      </div>
      <div class="setting-group">
        <label>Hand Size per Player:</label>
        <select id="hand-size">
          <option value="7">7 Tiles</option>
        </select>
      </div>
      <button onclick="createRoom()" style="margin-top: 10px;">Create Table</button>
    </div>
    
    <div style="margin-top: 25px; border-top: 1px solid #444; padding-top: 15px;">
      <h3>Join Existing Table</h3>
      <input type="text" id="room-input" placeholder="Enter Room Code/ID" style="width:100%;" />
      <button onclick="joinRoom()" style="background:#2196F3;">Join Table</button>
    </div>
  </div>

  <!-- CHOICE MODAL FOR DUAL END MATCHES -->
  <div id="choice-modal">
    <div class="modal-content">
      <h3>Tile fits both ends!</h3>
      <p style="margin: 10px 0; color: #ccc;">Choose which end of the board to play on:</p>
      <button id="choose-left" onclick="resolveChoice('left')" style="background:#009b3a;">Left End</button>
      <button id="choose-right" onclick="resolveChoice('right')" style="background:#d32f2f;">Right End</button>
    </div>
  </div>

  <!-- GAMEPLAY -->
  <div id="game-container">
    <div id="table">
      <div id="board-line"></div>
    </div>

    <div id="hand-container">
      <h3>Your Hand</h3>
      <div id="hand"></div>
      <button id="pass-btn" onclick="passTurn()" style="display:none; margin-top:12px; background:#d32f2f; width:auto; padding: 10px 25px;">PASS TURN</button>
    </div>
  </div>

    };
