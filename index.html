<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jamaican Domino Table</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      width: 100%;
      background: #000;
      padding: 15px;
      text-align: center;
      border-bottom: 3px solid #009b3a;
    }
    h1 { color: #fed100; font-size: 1.5rem; margin-bottom: 8px; }
    #lobby { margin: 20px; text-align: center; background: #1e1e1e; padding: 20px; border-radius: 8px; border: 1px solid #333; }
    input, select, button {
      padding: 10px 15px;
      font-size: 1rem;
      border-radius: 5px;
      border: none;
      margin: 5px;
    }
    select { background: #222; color: #fff; border: 1px solid #555; }
    button {
      background: #009b3a;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #007a2e; }
    .setting-group { margin: 12px 0; text-align: left; display: inline-block; }
    label { display: block; font-size: 0.9rem; color: #aaa; margin-bottom: 4px; }
    #game-container {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 1000px;
      margin-top: 10px;
    }
    #table {
      width: 95%;
      height: 440px;
      background: #1b5e20;
      border: 14px solid #3e2723;
      border-radius: 12px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.7);
    }
    #board-line {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 30px;
      min-width: max-content;
    }

    /* DROP TARGET ZONES */
    .drop-zone {
      width: 50px;
      height: 90px;
      border: 2px dashed #fed100;
      border-radius: 6px;
      background: rgba(254, 209, 0, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fed100;
      font-size: 0.8rem;
      text-transform: uppercase;
      transition: all 0.2s ease;
      user-select: none;
    }
    .drop-zone.drag-over {
      background: rgba(254, 209, 0, 0.4);
      transform: scale(1.08);
      border-style: solid;
    }

    /* DOMINO TILE STYLES */
    .domino {
      width: 46px;
      height: 88px;
      background: #fffdfa;
      border-radius: 6px;
      border: 2px solid #333;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 4px 8px rgba(0,0,0,0.5);
      user-select: none;
      transition: transform 0.15s ease;
    }
    .domino.horizontal {
      width: 88px;
      height: 46px;
      flex-direction: row;
    }
    .domino-half {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 3px;
      gap: 2px;
      align-items: center;
      justify-items: center;
    }
    .divider {
      height: 2px;
      background: #222;
      width: 100%;
    }
    .horizontal .divider {
      width: 2px;
      height: 100%;
    }
    .pip {
      width: 7px;
      height: 7px;
      background-color: #111;
      border-radius: 50%;
    }
    
    #hand-container {
      margin-top: 15px;
      text-align: center;
    }
    #hand {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .domino.draggable {
      cursor: grab;
    }
    .domino.draggable:active {
      cursor: grabbing;
      opacity: 0.6;
    }
    .domino.selectable:hover {
      transform: translateY(-8px);
      box-shadow: 0 0 12px #fed100;
      border-color: #fed100;
    }
    #status {
      margin: 10px;
      font-size: 1.1rem;
      color: #fed100;
    }
  </style>
</head>
<body>

  <header>
    <h1>JAMAICAN DOMINO TABLE 🁌</h1>
    <div id="status">Connecting to network...</div>
  </header>

  <!-- LOBBY -->
  <div id="lobby">
    <div id="host-controls">
      <h3>Create New Table</h3>
      <div class="setting-group">
        <label>Number of Players:</label>
        <select id="max-players" onchange="updateHandOptions()">
          <option value="4">4 Players</option>
          <option value="3">3 Players</option>
          <option value="2">2 Players</option>
        </select>
      </div>
      <br>
      <div class="setting-group">
        <label>Hand Size per Player:</label>
        <select id="hand-size">
          <option value="7">7 Tiles</option>
        </select>
      </div>
      <br>
      <button onclick="createRoom()">Create Table</button>
    </div>
    
    <div style="margin-top: 20px; border-top: 1px solid #444; padding-top: 15px;">
      <h3>Join Existing Table</h3>
      <input type="text" id="room-input" placeholder="Enter Room Code/ID" />
      <button onclick="joinRoom()">Join Table</button>
    </div>
  </div>

  <!-- GAMEPLAY -->
  <div id="game-container">
    <div id="table">
      <div id="board-line"></div>
    </div>

    <div id="hand-container">
      <h3>Your Hand</h3>
      <div id="hand"></div>
      <button id="pass-btn" onclick="passTurn()" style="display:none; margin-top:12px; background:#d32f2f;">PASS TURN</button>
    </div>
  </div>

  <script>
    let peer = null;
    let connections = [];
    let hostConn = null;
    let isHost = false;
    let myPlayerId = null;

    let gameState = {
      players: [],
      maxPlayers: 4,
      handSize: 7,
      turnIndex: 0,
      board: [],   
      hands: {},   
      gameStarted: false
    };

    let myHand = [];
    let draggedTile = null;

    peer = new Peer();

    peer.on('open', (id) => {
      myPlayerId = id;
      document.getElementById('status').innerText = `Your ID: ${id.substring(0, 5)}... Ready!`;
      
      const urlParams = new URLSearchParams(window.location.search);
      const roomId = urlParams.get('room');
      if (roomId) {
        document.getElementById('room-input').value = roomId;
        joinRoom();
      }
    });

    peer.on('connection', (conn) => {
      if (!isHost) return;
      connections.push(conn);
      
      conn.on('open', () => {
        if (gameState.players.length < gameState.maxPlayers && !gameState.gameStarted) {
          gameState.players.push(conn.peer);
          broadcastStatus(`Player joined (${gameState.players.length}/${gameState.maxPlayers})`);
          
          if (gameState.players.length === gameState.maxPlayers) {
            startGame();
          }
        }
      });

      conn.on('data', (data) => handleAction(data, conn.peer));
    });

    function updateHandOptions() {
      const maxP = parseInt(document.getElementById('max-players').value);
      const handSelect = document.getElementById('hand-size');
      handSelect.innerHTML = '';

      if (maxP === 4) {
        handSelect.innerHTML = `<option value="7">7 Tiles</option>`;
      } else if (maxP === 3) {
        handSelect.innerHTML = `
          <option value="7">7 Tiles</option>
          <option value="9">9 Tiles</option>
        `;
      } else if (maxP === 2) {
        handSelect.innerHTML = `
          <option value="7">7 Tiles</option>
          <option value="14">14 Tiles</option>
        `;
      }
    }

    function createRoom() {
      isHost = true;
      gameState.maxPlayers = parseInt(document.getElementById('max-players').value);
      gameState.handSize = parseInt(document.getElementById('hand-size').value);
      gameState.players = [myPlayerId];

      const roomLink = `${window.location.origin}${window.location.pathname}?room=${myPlayerId}`;
      
      document.getElementById('lobby').innerHTML = `
        <h3>Table Created!</h3>
        <p>Share this link with friends (${gameState.maxPlayers}-player table):</p>
        <input type="text" value="${roomLink}" readonly style="width: 80%; text-align:center;" id="share-link"/>
        <br>
        <button onclick="navigator.clipboard.writeText('${roomLink}')">Copy Link</button>
        <p style="margin-top:
